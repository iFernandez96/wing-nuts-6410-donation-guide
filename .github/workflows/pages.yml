name: Check and publish donation guide

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lint and browser tests
        run: docker compose run --rm checks

  prepare-publication:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify static calculator for publication
        run: docker compose run --rm checks npm run check:production
      - name: Upload static website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: prepare-publication
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
